name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto após ~7 dias sem acesso.
# Uma consulta diária mantém o banco ativo.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a API
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Espaço ou quebra de linha colado junto no segredo invalida a URL no curl.
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$KEY" | tr -d '[:space:]')
          # Sem segredo o ping não acontece e o banco pausa: falhar, para o GitHub avisar.
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::Segredos não configurados."; exit 1; fi
          curl -fsS "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -o /dev/null
          echo "Supabase respondeu."
